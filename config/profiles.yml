# Environment Profiles Configuration

# Development Profile
dev:
  environment: dev
  aws_region: us-east-1
  
  lambda:
    webhook:
      memory_size: 512
      timeout: 90
      log_retention: 7
    
    extract_text:
      memory_size: 1024
      timeout: 300
      log_retention: 7
  
  api_gateway:
    throttling:
      rate_limit: 1000
      burst_limit: 500
  
  s3:
    main_bucket: pfj-legal-tech-contracts-bucket-dev
    log_bucket: pfj-legal-tech-contracts-logs-dev
    lifecycle_days: 90
  
  monitoring:
    log_retention: 7
    alarms_enabled: false
  
  tags:
    Environment: dev
    CostCenter: Engineering

# QA Profile
qa:
  environment: qa
  aws_region: us-east-1
  
  lambda:
    webhook:
      memory_size: 1024
      timeout: 120
      log_retention: 14
    
    extract_text:
      memory_size: 2048
      timeout: 300
      log_retention: 14
  
  api_gateway:
    throttling:
      rate_limit: 2000
      burst_limit: 1000
  
  s3:
    main_bucket: pfj-legal-tech-contracts-bucket-qa
    log_bucket: pfj-legal-tech-contracts-logs-qa
    lifecycle_days: 90
  
  monitoring:
    log_retention: 14
    alarms_enabled: true
  
  tags:
    Environment: qa
    CostCenter: Engineering

# Production Profile
prod:
  environment: prod
  aws_region: us-east-1
  
  lambda:
    webhook:
      memory_size: 2048
      timeout: 120
      log_retention: 30
    
    extract_text:
      memory_size: 3008
      timeout: 300
      log_retention: 30
  
  api_gateway:
    throttling:
      rate_limit: 5000
      burst_limit: 2000
  
  s3:
    main_bucket: pfj-legal-tech-contracts-bucket-prod
    log_bucket: pfj-legal-tech-contracts-logs-prod
    lifecycle_days: 365
  
  monitoring:
    log_retention: 30
    alarms_enabled: true
  
  tags:
    Environment: prod
    CostCenter: Production
    Compliance: Required

# Shared Configuration (applies to all environments)
shared:
  jira:
    base_url: https://pilotflyingj-sandbox-951.atlassian.net
  
  secrets:
    arn: arn:aws:secretsmanager:us-east-1:021891594383:secret:jirawebhookconnections-qazW4L
  
  bedrock:
    model_id: amazon.nova-lite-v1:0
    region: us-east-1
  
  step_functions:
    name_prefix: TechContractAnalysisWorkflow
  
  eventbridge:
    connection_prefix: Jira-Connection
  
  waf:
    name_prefix: tech-JiraWebhookWAF
    scope: REGIONAL
