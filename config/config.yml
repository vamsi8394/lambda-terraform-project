# Project Configuration
project:
  name: lambda-terraform-project
  description: AWS Lambda functions with Terraform infrastructure
  version: 1.0.0

# AWS Configuration
aws:
  region: us-east-1
  account_id: "021891594383"

# Terraform Configuration
terraform:
  version: "1.5.7"
  backend:
    type: s3
    bucket: terraform-state-lambda-project
    dynamodb_table: terraform-state-lock

# Lambda Configuration
lambda:
  runtime: python3.13
  architecture: arm64
  
  functions:
    jira_webhook:
      name: tech-jirawebhooklambda
      handler: lambda_function.lambda_handler
      timeout: 90
      memory:
        dev: 512
        qa: 1024
        prod: 2048
      
    extract_text:
      name: tech-extracttextlambda
      handler: lambda_function.lambda_handler
      timeout: 300
      memory:
        dev: 1024
        qa: 2048
        prod: 3008

# API Gateway Configuration
api_gateway:
  name: tech-JiraWebhookAPI
  endpoint_type: REGIONAL
  binary_media_types:
    - "*/*"
  throttling:
    rate_limit: 1000
    burst_limit: 500
  cors:
    enabled: true
    allow_headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
    allow_methods:
      - POST
      - OPTIONS
    allow_origin: "*"

# WAF Configuration
waf:
  name: tech-JiraWebhookWAF
  scope: REGIONAL
  default_action: BLOCK
  
  ip_sets:
    jira_ipv4:
      - "13.52.5.96/28"
      - "13.236.8.224/28"
      - "18.136.214.96/28"
      - "18.184.99.224/28"
      - "18.234.32.224/28"
      - "18.246.31.224/28"
      - "52.215.192.224/28"
      - "104.192.137.240/28"
      - "104.192.138.240/28"
      - "104.192.140.240/28"
      - "104.192.142.240/28"
      - "104.192.143.240/28"
      - "185.166.143.240/28"
      - "185.166.142.240/28"
    
    jira_ipv6:
      - "2600:1f14:824:300::/56"
      - "2600:1f14:183:300::/56"
      - "2a05:d014:f99:dd00::/56"

  managed_rules:
    - AWSManagedRulesCommonRuleSet
    - AWSManagedRulesKnownBadInputsRuleSet
    - AWSManagedRulesAnonymousIpList
    - AWSManagedRulesSQLiRuleSet

# S3 Configuration
s3:
  versioning: true
  public_access_block: true
  lifecycle:
    expiration_days: 90
  logging:
    enabled: true
    prefix: "access-logs/"
  
  buckets:
    main:
      dev: pfj-legal-tech-contracts-bucket-dev
      qa: pfj-legal-tech-contracts-bucket-qa
      prod: pfj-legal-tech-contracts-bucket-prod
    
    logs:
      dev: pfj-legal-tech-contracts-logs-dev
      qa: pfj-legal-tech-contracts-logs-qa
      prod: pfj-legal-tech-contracts-logs-prod

# Step Functions Configuration
step_functions:
  name: TechContractAnalysisWorkflow
  
# EventBridge Configuration
eventbridge:
  connection_name: Jira-Connection

# Jira Configuration
jira:
  base_url: https://pilotflyingj-sandbox-951.atlassian.net

# Monitoring Configuration
monitoring:
  log_retention_days:
    dev: 7
    qa: 14
    prod: 30
  
  alarms:
    enabled: true
    lambda_errors_threshold: 5
    api_gateway_5xx_threshold: 10

# Tags
tags:
  Project: LambdaTerraformProject
  ManagedBy: Terraform
  Team: Engineering
