name: Manual Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.7

jobs:
  terraform-manual:
    name: Manual Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda Layer
        run: |
          chmod +x ./scripts/package-layer.sh
          ./scripts/package-layer.sh

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/${{ github.event.inputs.environment }}

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan
        working-directory: ./terraform/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve
        working-directory: ./terraform/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        working-directory: ./terraform/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
